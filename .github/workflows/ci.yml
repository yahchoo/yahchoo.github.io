name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # main에서만 실행. Cloudflare 시크릿 두 개(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID)만 있으면
  # Worker(같이 하기 서버)를 배포하고 주소를 웹에 넘긴다.
  deploy-worker:
    name: Deploy game server (Cloudflare)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: yacht-dice
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Check Cloudflare settings
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare 시크릿이 없어 서버 배포를 건너뜁니다. 웹은 혼자 하기만 되는 상태로 배포됩니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cf.outputs.ready == 'true'
        run: npm ci

      # 혼자 하기 랭킹용 D1 데이터베이스. 없으면 만들고, 실제 ID를 wrangler.toml에 넣는다.
      # API 토큰에 Account · D1 · Edit 권한이 있어야 한다.
      - name: Find or create D1 database
        if: steps.cf.outputs.ready == 'true'
        run: |
          find_id() {
            npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid' | head -n1
          }
          id="$(find_id || true)"
          if [ -z "$id" ]; then
            echo "D1 데이터베이스 '$DB_NAME'이 없어 새로 만듭니다."
            npx wrangler d1 create "$DB_NAME" --location apac || true
            id="$(find_id || true)"
          fi
          if [ -z "$id" ]; then
            echo "::error::D1 데이터베이스를 찾거나 만들지 못했습니다. Cloudflare API 토큰에 Account · D1 · Edit 권한이 있는지 확인하세요."
            exit 1
          fi
          echo "D1 database id: $id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml

      - name: Apply D1 migrations
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      # 구글 로그인 클라이언트 ID (공개값). 저장소 변수 GOOGLE_CLIENT_ID가 있으면 그 값을 우선 쓴다.
      # 앱: 저장소 변수 GOOGLE_APP_CLIENT_IDS(쉼표로 구분, 예: iOS 클라이언트 ID)를 웹 ID와 함께 허용 목록(GOOGLE_CLIENT_IDS)에 넣는다.
      # Android 앱은 웹 클라이언트 ID로 토큰을 받으므로 따로 넣지 않아도 된다.
      - name: Set Google client ID
        if: steps.cf.outputs.ready == 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '994205737094-50gr21rv5gd4jmrk3drgq3462k6k2rj7.apps.googleusercontent.com' }}
          GOOGLE_APP_CLIENT_IDS: ${{ vars.GOOGLE_APP_CLIENT_IDS || '' }}
        run: |
          id_ok() { printf '%s' "$1" | grep -Eq '^[0-9A-Za-z._-]+\.apps\.googleusercontent\.com$'; }
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::notice::저장소 변수 GOOGLE_CLIENT_ID가 없어 로그인 없이 배포합니다."
          elif ! id_ok "$GOOGLE_CLIENT_ID"; then
            echo "::error::GOOGLE_CLIENT_ID 형식이 이상해요. '...apps.googleusercontent.com'으로 끝나는 클라이언트 ID를 넣어 주세요."
            exit 1
          else
            ids="$GOOGLE_CLIENT_ID"
            for app_id in $(printf '%s' "$GOOGLE_APP_CLIENT_IDS" | tr ',' ' '); do
              if ! id_ok "$app_id"; then
                echo "::error::GOOGLE_APP_CLIENT_IDS에 형식이 이상한 값이 있어요: $app_id"
                exit 1
              fi
              ids="$ids,$app_id"
            done
            sed -i "s/^GOOGLE_CLIENT_ID = \"\"/GOOGLE_CLIENT_ID = \"$GOOGLE_CLIENT_ID\"/" wrangler.toml
            sed -i "s/^GOOGLE_CLIENT_IDS = \"\"/GOOGLE_CLIENT_IDS = \"$ids\"/" wrangler.toml
            grep '^GOOGLE_CLIENT_ID' wrangler.toml
          fi

      - name: Deploy worker
        id: deploy
        if: steps.cf.outputs.ready == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)"
          if [ -z "$url" ]; then
            echo "::warning::배포된 Worker 주소를 찾지 못했습니다. 저장소 변수 API_BASE_URL에 주소를 직접 넣어 주세요."
          else
            echo "Worker URL: $url"
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Health check
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$URL/api/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::서버가 응답하지 않습니다: $URL/api/health"
          exit 1

  build-web:
    name: Build web
    needs: deploy-worker
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 서버 주소: 저장소 변수 API_BASE_URL이 있으면 그 값, 없으면 방금 배포한 Worker 주소.
      # 구글 로그인: 저장소 변수 GOOGLE_CLIENT_ID (서버가 없으면 로그인도 쓰지 않는다)
      - name: Write server address
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || needs.deploy-worker.outputs.url }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '994205737094-50gr21rv5gd4jmrk3drgq3462k6k2rj7.apps.googleusercontent.com' }}
          # 애드센스: 저장소 변수 ADSENSE_CLIENT(ca-pub-…), ADSENSE_SLOTS(JSON). 없으면 광고 없이 배포한다.
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT || '' }}
          ADSENSE_SLOTS: ${{ vars.ADSENSE_SLOTS || '{}' }}
        run: |
          mkdir -p _site
          cp -r web/. _site/
          if [ -z "$API_BASE_URL" ]; then
            echo "::notice::서버 주소가 없어 같이 하기·랭킹·로그인 없이 배포합니다."
            GOOGLE_CLIENT_ID=""
          fi
          echo "서버: ${API_BASE_URL:-없음} / 구글 로그인: ${GOOGLE_CLIENT_ID:-없음}"
          if [ -n "$ADSENSE_CLIENT" ] && ! printf '%s' "$ADSENSE_CLIENT" | grep -Eq '^ca-pub-[0-9]{10,20}$'; then
            echo "::warning::ADSENSE_CLIENT 형식이 이상해서(ca-pub-숫자) 광고 없이 배포합니다."
            ADSENSE_CLIENT=""
          fi
          if ! printf '%s' "$ADSENSE_SLOTS" | jq -e 'type == "object" and all(.[]; tostring | test("^[0-9]{6,20}$"))' > /dev/null; then
            echo "::warning::ADSENSE_SLOTS가 올바른 JSON이 아니라 광고 없이 배포합니다."
            ADSENSE_SLOTS='{}'
          fi
          ADSENSE_SLOTS=$(printf '%s' "$ADSENSE_SLOTS" | jq -c 'map_values(tostring)')
          echo "광고: ${ADSENSE_CLIENT:-없음} $ADSENSE_SLOTS"
          printf "export const API_BASE = '%s';\nexport const GOOGLE_CLIENT_ID = '%s';\nexport const ADSENSE_CLIENT = '%s';\nexport const ADSENSE_SLOTS = %s;\n" "$API_BASE_URL" "$GOOGLE_CLIENT_ID" "$ADSENSE_CLIENT" "$ADSENSE_SLOTS" > _site/js/config.js
          cat _site/js/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: ${{ !cancelled() && needs.build-web.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
