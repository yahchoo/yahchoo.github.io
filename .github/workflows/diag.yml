# 서버 진단 (손으로 실행할 때만). 배포는 하지 않고 읽기만 한다.
# - 데이터베이스(D1) 위치·크기·행 수
# - 최근 24시간 요청 수·오류·CPU 시간, D1 쿼리 수·시간 (Cloudflare 분석)
# - 실제 응답 시간 (혼자 하기 시작·굴리기, 랭킹)
name: Diagnose server

on:
  workflow_dispatch:
  push:
    branches: [diag]

permissions:
  contents: write  # 결과를 diag-results 브랜치에 남긴다

jobs:
  diag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API: https://yacht-dice-api.shark-keeper.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      - name: D1 info
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a /tmp/report.txt) 2>&1
          echo '### D1 info'
          W="$GITHUB_WORKSPACE/worker/node_modules/.bin/wrangler"
          cd "$RUNNER_TEMP"   # wrangler.toml의 임시 ID 대신 이름으로 찾게 한다
          $W d1 list --json | jq -c '.[] | select(.name == "yacht-dice")' | tee /tmp/d1info.json
          $W d1 info yacht-dice

      - name: D1 rows
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a /tmp/report.txt) 2>&1
          echo '### D1 rows'
          W="$GITHUB_WORKSPACE/worker/node_modules/.bin/wrangler"
          cd "$RUNNER_TEMP"
          q() { $W d1 execute yacht-dice --remote --json --command "$1" | jq -c '.[0].results' || true; }
          NOW=$(($(date +%s) * 1000))
          echo "tables:"; q "SELECT 'solo_games' t, COUNT(*) n FROM solo_games UNION ALL SELECT 'rankings', COUNT(*) FROM rankings UNION ALL SELECT 'users', COUNT(*) FROM users UNION ALL SELECT 'sessions', COUNT(*) FROM sessions UNION ALL SELECT 'point_log', COUNT(*) FROM point_log"
          echo "games updated in last 1h / 24h:"; q "SELECT SUM(updated_at > $NOW - 3600000) h1, SUM(updated_at > $NOW - 86400000) h24, SUM(started_at > $NOW - 86400000) started24 FROM solo_games"
          echo "rankings this week:"; q "SELECT COUNT(*) n FROM rankings WHERE played_at > $NOW - 7*86400000"
          echo "rolls per hour (last 24h, by updated_at buckets):"; q "SELECT (updated_at / 3600000) % 24 AS hour_utc, COUNT(*) n FROM solo_games WHERE updated_at > $NOW - 86400000 GROUP BY 1 ORDER BY 1"
          echo "plan ranking list:"; q "EXPLAIN QUERY PLAN WITH r AS (SELECT rankings.*, ROW_NUMBER() OVER (PARTITION BY COALESCE(user_id, 'g' || id) ORDER BY score DESC, played_at ASC, id ASC) AS rn FROM rankings WHERE played_at >= 0) SELECT r.id FROM r LEFT JOIN users u ON u.id = r.user_id WHERE r.rn = 1 ORDER BY r.score DESC LIMIT 50"

      - name: Cloudflare analytics (24h)
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a /tmp/report.txt) 2>&1
          echo '### Cloudflare analytics (24h)'
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ); UNTIL=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DBID=$(jq -r '.uuid // .id // empty' /tmp/d1info.json 2>/dev/null); echo "db $DBID"
          QUERY=$(jq -n --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg s "$SINCE" --arg u "$UNTIL" --arg db "$DBID" '{query: "query($a:String!,$s:Time!,$u:Time!,$db:String!){viewer{accounts(filter:{accountTag:$a}){workers:workersInvocationsAdaptive(limit:20,filter:{datetime_geq:$s,datetime_leq:$u,scriptName:\"yacht-dice-api\"}){sum{requests errors subrequests} quantiles{cpuTimeP50 cpuTimeP99 durationP50 durationP99 wallTimeP50 wallTimeP99} dimensions{status}} d1:d1AnalyticsAdaptiveGroups(limit:10000,filter:{datetime_geq:$s,datetime_leq:$u,databaseId:$db}){sum{readQueries writeQueries rowsRead rowsWritten} quantiles{queryBatchTimeMsP50 queryBatchTimeMsP90} dimensions{datetimeHour}} dos:durableObjectsInvocationsAdaptiveGroups(limit:20,filter:{datetime_geq:$s,datetime_leq:$u}){sum{requests errors} quantiles{wallTimeP50 wallTimeP99}}}}}", variables: {a: $a, s: $s, u: $u, db: $db}}')
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' -d "$QUERY" > /tmp/an.json
          jq -c '.errors' /tmp/an.json
          echo "== worker"; jq -c '.data.viewer.accounts[0].workers[]?' /tmp/an.json
          echo "== d1 per hour (UTC)"; jq -c '.data.viewer.accounts[0].d1 | sort_by(.dimensions.datetimeHour)[]? | {h: .dimensions.datetimeHour[11:13], r: .sum.readQueries, w: .sum.writeQueries, rowsR: .sum.rowsRead, rowsW: .sum.rowsWritten, p50: .quantiles.queryBatchTimeMsP50, p90: .quantiles.queryBatchTimeMsP90}' /tmp/an.json
          echo "== d1 total"; jq -c '[.data.viewer.accounts[0].d1[]?.sum] | {readQueries: (map(.readQueries)|add), writeQueries: (map(.writeQueries)|add), rowsRead: (map(.rowsRead)|add), rowsWritten: (map(.rowsWritten)|add)}' /tmp/an.json
          echo "== durable objects"; jq -c '.data.viewer.accounts[0].dos[]?' /tmp/an.json

      - name: Response times (from GitHub runner)
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a /tmp/report.txt) 2>&1
          echo '### Response times (from GitHub runner)'
          t() { curl -s -o /tmp/out -w '%{time_total}' "$@"; }
          for i in 1 2 3; do echo "health $(t $API/api/health)"; done
          S=$(curl -s -X POST -H 'Content-Type: application/json' -d '{}' -w '\n%{time_total}' $API/api/solo/start)
          ID=$(echo "$S" | head -1 | jq -r .gameId); echo "start $(echo "$S" | tail -1)"
          for i in 1 2 3; do echo "roll $(t -X POST -H 'Content-Type: application/json' -d "{\"gameId\":\"$ID\",\"held\":[false,false,false,false,false]}" $API/api/solo/roll) $(head -c 80 /tmp/out)"; done
          echo "score $(t -X POST -H 'Content-Type: application/json' -d "{\"gameId\":\"$ID\",\"category\":\"choice\"}" $API/api/solo/score)"
          echo "rank week $(t "$API/api/rankings?period=week&limit=50")"
          echo "rank all $(t "$API/api/rankings?period=all&limit=50")"
          curl -sI $API/api/health | grep -i cf-ray

      - name: Save report to diag-results branch
        if: always()
        working-directory: .
        run: |
          cp /tmp/report.txt "$RUNNER_TEMP/report.txt" 2>/dev/null || echo "no report" > "$RUNNER_TEMP/report.txt"
          git config user.name diag && git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-results
          git rm -rfq . > /dev/null
          cp "$RUNNER_TEMP/report.txt" report.txt
          git add report.txt && git commit -q -m "diag $(date -u +%FT%TZ)"
          git push -f origin diag-results 2>&1
