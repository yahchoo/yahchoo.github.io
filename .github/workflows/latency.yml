# 응답 지연 점검 (손으로 실행). 새 주소와 예전 주소를 단계별 시간(DNS·연결·TLS·첫 바이트)으로 비교한다.
name: 응답 지연 점검

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 단계별 시간
        run: |
          fmt='dns=%{time_namelookup} conn=%{time_connect} tls=%{time_appconnect} first=%{time_starttransfer} total=%{time_total} code=%{http_code}\n'
          for host in "https://api.ohsangplay.com/yahchoo" "https://yacht-dice-api.shark-keeper.workers.dev"; do
            echo "== $host (새 연결 20번)"
            for i in $(seq 1 20); do curl -s -o /dev/null -w "$fmt" -m 20 "$host/api/health"; done | tee /tmp/r.txt
            awk '{split($5,a,"="); t=a[2]+0; s+=t; if(t>m)m=t; if(t>1)slow++} END {printf "평균 %.2fs, 최대 %.2fs, 1초 넘은 횟수 %d/20\n", s/NR, m, slow}' /tmp/r.txt | tee /tmp/sum.txt
            echo "::notice title=$(echo $host | cut -d/ -f3)::$(cat /tmp/sum.txt)"
            echo "== $host (한 연결로 20번)"
            urls=$(for i in $(seq 1 20); do printf "%s/api/health " "$host"; done)
            curl -s -o /dev/null -w "$fmt" -m 60 $urls | awk '{print} {split($5,a,"="); t=a[2]+0; s+=t; if(t>m)m=t} END {printf "연결 재사용: 평균 %.3fs, 최대 %.2fs\n", s/NR, m}' | tail -1 | tee /tmp/sum2.txt
            echo "::notice title=$(echo $host | cut -d/ -f3) 재사용::$(cat /tmp/sum2.txt)"
          done
          echo "== 응답 헤더"
          curl -s -D - -o /dev/null https://api.ohsangplay.com/yahchoo/api/health | grep -iE 'cf-ray|server|cf-cache|alt-svc'

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 같이 하기 방 위치 (미국에서 만들어도 아시아에 생기는지)
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -X POST -H 'content-type: application/json' -H 'origin: https://yahchoo.ohsangplay.com' -d '{"mode":"1v1"}' https://api.ohsangplay.com/yahchoo/api/rooms | jq -r .code)
            echo "::notice title=방 위치::방 $CODE → $(curl -s https://api.ohsangplay.com/yahchoo/api/rooms/$CODE/where)"
          done
      - name: 같이 하기 응답 시간
        run: |
          node tools/mp-latency.mjs https://api.ohsangplay.com/yahchoo 10 0,15,0,40,0 | tee /tmp/mp.txt
          while read -r line; do echo "::notice title=같이 하기::$line"; done < /tmp/mp.txt

      - name: Cloudflare 시간대별·지역별
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash tools/cf-latency.sh | tee /tmp/cf.txt
          # 주석 10개 제한이 있어 묶어서 남긴다
          for sec in "Worker 시간대별" "Worker 지역별" "Durable Object" "D1 시간대별"; do
            body=$(awk -v s="$sec" '/^== /{p=index($0,s)>0; next} p' /tmp/cf.txt | tr '\n' '|' | head -c 3500)
            echo "::notice title=$sec::$body"
          done
